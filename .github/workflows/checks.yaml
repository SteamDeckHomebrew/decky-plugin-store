name: Checks

on:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: PR lint and tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Verify PR revision
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          actual_sha=$(git rev-parse HEAD)
          echo "Testing PR revision: $actual_sha"
          test "$actual_sha" = "$EXPECTED_SHA"

      - name: Build PR test image
        id: build
        run: docker build --tag plugin-store-checks .

      - name: Lint PR source
        run: docker run --rm --workdir /app plugin-store-checks make lint

      - name: Test PR source
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: docker run --rm --workdir /app plugin-store-checks make test
