name: "Test container image build"

"on":
  pull_request:
    branches:
      - main

jobs:
  buildx:
    name: "Build image with docker buildx"
    
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
    
    steps:
      -
        name: "Full clone repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      -
        name: "Setup qemu"
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4.4.0
        with:
          platforms: >-
            amd64,
            arm64
      -
        name: "Setup buildx"
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      -
        name: "Get image metadata from workflow"
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        id: meta
        with:
          images: |-
            ghcr.io/${{ github.repository }}
          flavor: |-
            latest=false
          # language=csv
          tags: |-
            type=sha,format=long,prefix=sha-
            type=sha,format=short,prefix=r${{ steps.revision.outputs.revision }}-
      -
        name: "Build image"
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          # use path context instead of Git context
          # https://github.com/docker/build-push-action#git-context
          context: .
          # perform a multiplatform build with the previously-installed QEMU
          # https://docs.docker.com/build/building/multi-platform/
          platforms: >-
            linux/amd64,
            linux/arm64
          # use GitHub Actions cache
          # https://docs.docker.com/build/cache/backends/gha/
          cache-from: type=gha
          cache-to: type=gha,mode=max
