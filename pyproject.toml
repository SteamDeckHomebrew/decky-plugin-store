[build-system]
requires = ["poetry-core >= 2.0.0, < 3.0.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "plugin_store"
version = "0.1.0"
description = "Plugin Store backend for Decky"
authors = []
maintainers = []
license = "AGPL-3.0"  # TODO: Only, or or-later?
license-files = ["LICENSE"]
readme = "README.md"
keywords = []
classifiers = [
    "Private :: Do Not Upload",  # application, not a package, not suitable for upload
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet",
]
requires-python = ">=3.11"
dependencies = [
    "aiohttp >= 3.10.11, == 3.*",
    "alembic >= 1.13.2, == 1.*",
    "aiosqlite >= 0.20.0, == 0.20.*", # for async sqlite in sqlalchemy
    "asgiref >= 3.8.1, == 3.*",
    # this will break if Python 4 ever releases, but unfortunately it's hardcoded in the dependency itself
    # https://github.com/lovvskillz/python-discord-webhook/blob/98cce42971eb752d7a6caf09863031e41178e880/pyproject.toml#L14
    "discord-webhook [async] >= 1.4.1, == 1.* ; python_version < '4.0'",
    "fastapi >= 0.112.0, == 0.112.*",
    "pydantic >= 1.10.17, == 1.*",
    "python-multipart >= 0.0.18, == 0.0.*",  # for multipart forms in fastapi
    "sqlalchemy [asyncio] >= 2.1.5, == 2.*",
    "uvicorn >= 0.30.6, == 0.30.*",
    "limits [redis] >= 5.8.0, == 5.*",
    "redis >= 5.0.8, == 5.*",
    "asyncpg >= 0.32.0, == 0.32.*", # for async postgres in sqalchemy
    "httpx >= 0.28.1, == 0.28.*",
    "semver >= 3.1.0, == 3.*",
]

[project.urls]
Website = "https://plugins.deckbrew.xyz/"
Repository = "https://github.com/SteamDeckHomebrew/decky-plugin-store"
Issues = "https://github.com/SteamDeckHomebrew/decky-plugin-store/issues"
Funding = "https://opencollective.com/steamdeckhomebrew"
Discord = "https://decky.xyz/discord"

[dependency-groups]
dev = [
    "black >= 26.10.1, == 26.*",
    "flake8 >= 7.4.1, == 7.*",
    "flake8-pyproject >= 1.2.4, == 1.*",
    "isort >= 9.0.2, == 9.*",
    "mypy >= 2.4.0, == 2.*",
    "pytest >= 9.1.1, == 9.*",
    "pytest-asyncio >= 1.4.0, == 1.*",
    "pytest-env >= 1.8.0, == 1.*",
    "pytest-freezer >= 0.4.9, == 0.4.*",
    "pytest-mock >= 3.17.0, == 3.*",
    "types-pytest-lazy-fixture >= 0.6.3.20260518, == 0.6.*",
    "pytest-lazy-fixtures >= 1.4.1, == 1.*",
    "alembic >= 1.20.0, == 1.*",
]

[tool.black]
line-length = 120
target-version = ['py311']
include = '\.pyi?$'
exclude = '''
(
    /(
        \.eggs
      | \.git
      | \.hg
      | \.mypy_cache
      | \.tox
      | \.venv
      | _build
      | buck-out
      | build
      | dist
    )/
)
'''

[tool.flake8]
max-line-length = 120

[tool.isort]
line_length = 120
order_by_type = false
profile = "black"
src_paths = ["plugin_store", "tests"]

[tool.mypy]
plugins = []

[[tool.mypy.overrides]]
module = ["discord_webhook", "limits"]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = "./plugin_store"
env = [
    "DB_URL=sqlite+aiosqlite:///:memory:",
    "SUBMIT_AUTH_KEY=deadbeef",
]
asyncio_mode = "auto"
