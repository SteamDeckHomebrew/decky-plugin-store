[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "decky-plugin-store"
version = "0.1.0"
description = "Plugin Store backend for Decky"
authors = ["Your Name <you@example.com>"]
readme = "README.md"
packages = []

[tool.poetry.dependencies]
python = "^3.11"
aiohttp = "^3.10.11"
alembic = "^1.13.2"
aiosqlite = "^0.20.0" # for async sqlite in sqlalchemy
asgiref = "^3.8.1"
discord-webhook = {extras = ["async"], version = "^1.4.1"}
fastapi = "^0.112.0"
pydantic = "^1.10.17"
python-multipart = "^0.0.18"  # for multipart forms in fastapi
sqlalchemy = {extras = ["asyncio"], version = "^2.1.5"}
uvicorn = "^0.30.6"
limits = {extras = ["redis"], version = "^5.8.0"}
redis = "^5.0.8"
asyncpg = "^0.32.0" # for async postgres in sqalchemy
httpx = "^0.28.1"
semver = "^3.1.0"

[tool.poetry.group.dev.dependencies]
black = "^26.10.1"
flake8 = "^7.4.1"
flake8-pyproject = "^1.2.4"
isort = "^9.0.2"
mypy = "^2.4.0"
pytest = "^9.1.1"
pytest-asyncio = "^1.4.0"
pytest-env = "^1.8.0"
pytest-freezer = "^0.4.9"
pytest-mock = "^3.17.0"
types-pytest-lazy-fixture = "^0.6.3.20260518"
pytest-lazy-fixtures = "^1.4.1"
alembic = "^1.20.0"

[tool.black]
line-length = 120
target-version = ['py39', 'py310', 'py311']
include = '\.pyi?$'
exclude = '''
(
    /(
        \.eggs
      | \.git
      | \.hg
      | \.mypy_cache
      | \.tox
      | \.venv
      | _build
      | buck-out
      | build
      | dist
    )/
)
'''

[tool.flake8]
max-line-length = 120

[tool.isort]
line_length = 120
order_by_type = false
profile = "black"
src_paths = ["plugin_store", "tests"]

[tool.mypy]
plugins = [
    "sqlalchemy.ext.mypy.plugin",
]

[[tool.mypy.overrides]]
module = ["discord_webhook", "limits"]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = "./plugin_store"
env = [
    "DB_URL=sqlite+aiosqlite:///:memory:",
    "SUBMIT_AUTH_KEY=deadbeef",
]
asyncio_mode = "auto"
